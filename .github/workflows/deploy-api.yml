name: Deploy API

on:
  push:
    branches: ["dev"]
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server deps
        run: |
          cd server
          pnpm install --frozen-lockfile

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile.api
          push: true
          tags: |
            ghcr.io/nikaytos/chef-claude-srp3-api:latest
            ghcr.io/nikaytos/chef-claude-srp3-api:${{ github.sha }}

      - name: Deploy only API via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_APP_PATH }}"

            umask 177
            cat > .env <<'EOF'
            ACCESS_CODE=${{ secrets.ACCESS_CODE }}
            HF_ACCESS_TOKEN=${{ secrets.HF_ACCESS_TOKEN }}
            EOF

            echo "== Services =="
            docker compose config --services

            docker compose pull
            docker compose up -d
            docker image prune -f
