name: Build & Deploy

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/nikaytos/chef-claude-srp3:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ secrets.SERVER_APP_PATH }}
            cd ${{ secrets.SERVER_APP_PATH }}
            cat > docker-compose.yml <<'YML'
            services:
              web:
                image: ghcr.io/nikaytos/chef-claude-srp3:latest
                container_name: chef-claude-web
                restart: unless-stopped
                ports:
                  - "127.0.0.1:4000:80"
            YML
            docker compose pull
            docker compose up -d
            docker image prune -f
