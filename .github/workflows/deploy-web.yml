name: Deploy Web

on:
  push:
    branches: ["dev"]
    paths-ignore:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push WEB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          build-args: |
            VITE_API_URL=/chef-claude-srp3/api
          tags: |
            ghcr.io/nikaytos/chef-claude-srp3-web:latest
            ghcr.io/nikaytos/chef-claude-srp3-web:${{ github.sha }}

      - name: Deploy only WEB via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_PATH }}
            docker compose pull web
            docker compose up -d web
            docker image prune -f
